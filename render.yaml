services:
  - type: web
    name: inventory-management-system
    runtime: java
    plan: free
    buildCommand: ./gradlew build
    startCommand: java -jar build/libs/inventorymanagementsystem-0.0.1-SNAPSHOT.jar
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 8086
      - key: LOG_LEVEL_APP
        value: INFO
