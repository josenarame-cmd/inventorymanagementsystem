# ============================================================
# PRODUCTION PROFILE — Activated on Render via SPRING_PROFILES_ACTIVE=prod
# ============================================================

# MySQL Database (Aiven) - fallback to H2 if DATABASE_URL not set
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:prod-db}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

# JPA / Hibernate - auto-detect dialect
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (disabled in production unless using H2 fallback)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# HikariCP Connection Pool — prevents connection drops & password denial on reconnect
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# Production logging (less verbose)
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.jose.group.inventorymanagementsystem=${LOG_LEVEL_APP:INFO}
