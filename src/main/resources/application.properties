server.port=${PORT:8086}

# ============================================================
# DEFAULT PROFILE — Local Development (H2 in-memory database)
# Production overrides are in application-prod.properties
# Activated on Render via SPRING_PROFILES_ACTIVE=prod
# ============================================================

# H2 Database (local dev only)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

# Disable automatic data.sql execution (we use DataSeeder Java class instead)
spring.sql.init.mode=never

# JWT Secret
app.jwt.secret=${JWT_SECRET:9a67475d4924c58e454911d32488aef6a67475d4924c58e454911d32488aef6}
app.jwt.expiration-ms=86400000

# Logging Configuration
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.jose.group.inventorymanagementsystem=DEBUG