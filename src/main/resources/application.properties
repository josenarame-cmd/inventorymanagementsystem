server.port=${PORT:8086}
# Database Configuration 
# Uses environment variables in Production (e.g., Render), falls back to H2 in-memory locally
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.show-sql=true

# Disable automatic data.sql execution (we use DataSeeder Java class instead)
spring.sql.init.mode=never

# JWT Secret
app.jwt.secret=${JWT_SECRET:9a67475d4924c58e454911d32488aef6a67475d4924c58e454911d32488aef6}
app.jwt.expiration-ms=86400000

# Logging Configuration
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.jose.group.inventorymanagementsystem=DEBUG